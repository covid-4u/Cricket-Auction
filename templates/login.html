<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricBid Pro — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #FFD700; --gold2: #FFA500; --dark: #0a0a0f; --dark2: #111118;
  --dark3: #1a1a26; --accent: #6C63FF; --text: #e8e8f0; --muted: #6b6b8a;
  --border: rgba(108,99,255,0.2); --red: #FF1744;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--dark); color: var(--text); font-family: 'Inter', sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background-image:
    radial-gradient(ellipse at 30% 40%, rgba(108,99,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(255,77,109,0.08) 0%, transparent 60%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236C63FF' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.login-container {
  width: 420px; 
}
.login-header { text-align: center; margin-bottom: 40px; }
.login-header h1 {
  font-family: 'Teko', sans-serif; font-size: 52px; font-weight: 700;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
}
.login-header p { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
.login-card {
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 16px; padding: 40px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.form-group { margin-bottom: 24px; }
label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
input {
  width: 100%; padding: 12px 16px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 15px;
  transition: all 0.2s; font-family: 'Inter', sans-serif;
}
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
.btn-login {
  width: 100%; padding: 14px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #a855f7);
  color: white; font-family: 'Teko', sans-serif; font-size: 20px;
  font-weight: 600; letter-spacing: 2px; cursor: pointer;
  transition: all 0.2s; text-transform: uppercase;
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,99,255,0.4); }
.error { background: rgba(255,23,68,0.1); border: 1px solid rgba(255,23,68,0.3); color: var(--red); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-family: 'Rajdhani', sans-serif; font-weight: 500; }
.default-creds { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
.default-creds code { background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; color: var(--gold); }
.cricket-icon { font-size: 48px; margin-bottom: 12px; display: block; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
</style>
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <span class="cricket-icon">🏏</span>
    <h1>CRICBID</h1>
    <p>Pro Auction Platform</p>
  </div>
  <div class="login-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="error">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login">Enter the Arena</button>
    </form>
    <div class="default-creds">
      Default: <code>admin</code> / <code>admin123</code>
    </div>
  </div>
</div>
</body>
</html>
